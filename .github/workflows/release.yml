name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  reproducibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      MASTERY_HOME: ${{ github.workspace }}/work/release-mastery-home
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify source and tests on release platform
        run: |
          python quality/build_adapters.py --check
          python -m compileall -q skills adapters quality
          python -m unittest discover -s quality -p "test_*.py" -v
      - name: Build platform candidates
        run: |
          python quality/build_release.py --kind core --output work/release-candidates/core.zip
          python quality/build_release.py --kind codex --output work/release-candidates/codex.zip
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ runner.os }}
          path: work/release-candidates/*.zip
          if-no-files-found: error

  release:
    needs: reproducibility
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      MASTERY_HOME: ${{ github.workspace }}/work/release-mastery-home
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: release-candidate-*
          path: work/reproducibility
      - name: Compare Linux, Windows, and macOS release bytes
        shell: bash
        run: |
          python quality/release_audit.py compare work/reproducibility/release-candidate-Linux/core.zip work/reproducibility/release-candidate-Windows/core.zip work/reproducibility/release-candidate-macOS/core.zip
          python quality/release_audit.py compare work/reproducibility/release-candidate-Linux/codex.zip work/reproducibility/release-candidate-Windows/codex.zip work/reproducibility/release-candidate-macOS/codex.zip
      - id: version
        name: Match tag to VERSION
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          test "${GITHUB_REF_NAME}" = "v${version}"
          echo "value=${version}" >> "$GITHUB_OUTPUT"
      - name: Verify generated adapters
        run: python quality/build_adapters.py --check
      - name: Verify curriculum and eval suite
        shell: bash
        run: |
          python skills/mastery-coach/scripts/curriculum_audit.py
          python quality/eval_audit.py suite quality/evals/plugin-evals.json
      - name: Run full tests
        run: python -m unittest discover -s quality -p "test_*.py" -v
      - name: Require release-quality conversation evidence
        run: >-
          python quality/eval_audit.py release-evidence
          quality/evals/plugin-evals.json
          quality/evals/results/${{ steps.version.outputs.value }}
      - name: Build release archives
        shell: bash
        run: |
          python quality/build_release.py --kind core --output "work/mastery-tutor-${{ steps.version.outputs.value }}-core.zip" --checksum-output "work/mastery-tutor-${{ steps.version.outputs.value }}-core.zip.sha256"
          python quality/build_release.py --kind codex --output "work/mastery-tutor-${{ steps.version.outputs.value }}-codex.zip" --checksum-output "work/mastery-tutor-${{ steps.version.outputs.value }}-codex.zip.sha256"
      - name: Audit release archives
        shell: bash
        run: |
          python quality/release_audit.py archive "work/mastery-tutor-${{ steps.version.outputs.value }}-core.zip" --kind core --git-ref HEAD --expected-version "${{ steps.version.outputs.value }}"
          python quality/release_audit.py archive "work/mastery-tutor-${{ steps.version.outputs.value }}-codex.zip" --kind codex --git-ref HEAD --expected-version "${{ steps.version.outputs.value }}"
      - name: Attest core archive
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: work/mastery-tutor-${{ steps.version.outputs.value }}-core.zip
      - name: Attest Codex archive
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: work/mastery-tutor-${{ steps.version.outputs.value }}-codex.zip
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" --verify-tag --title "Mastery Tutor ${GITHUB_REF_NAME}" --generate-notes "work/mastery-tutor-${{ steps.version.outputs.value }}-core.zip" "work/mastery-tutor-${{ steps.version.outputs.value }}-core.zip.sha256" "work/mastery-tutor-${{ steps.version.outputs.value }}-codex.zip" "work/mastery-tutor-${{ steps.version.outputs.value }}-codex.zip.sha256"
