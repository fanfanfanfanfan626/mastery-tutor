name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      MASTERY_HOME: ${{ github.workspace }}/work/ci-mastery-home
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - id: version
        name: Read release version
        shell: bash
        run: echo "value=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Verify generated adapters
        run: python quality/build_adapters.py --check
      - name: Audit curriculum
        run: python skills/mastery-coach/scripts/curriculum_audit.py
      - name: Audit conversation eval suite
        run: python quality/eval_audit.py suite quality/evals/plugin-evals.json
      - name: Compile Python sources
        run: python -m compileall -q skills adapters quality
      - name: Run system tests
        run: python -m unittest discover -s quality -p "test_*.py" -v
      - name: Build core candidate
        run: >-
          python quality/build_release.py --kind core
          --output work/mastery-tutor-${{ steps.version.outputs.value }}-core.zip
          --checksum-output work/mastery-tutor-${{ steps.version.outputs.value }}-core.zip.sha256
      - name: Build Codex candidate
        run: >-
          python quality/build_release.py --kind codex
          --output work/mastery-tutor-${{ steps.version.outputs.value }}-codex.zip
          --checksum-output work/mastery-tutor-${{ steps.version.outputs.value }}-codex.zip.sha256
      - name: Audit candidates against checked-out Git tree
        shell: bash
        run: |
          python quality/release_audit.py archive "work/mastery-tutor-${{ steps.version.outputs.value }}-core.zip" --kind core --git-ref HEAD --expected-version "${{ steps.version.outputs.value }}"
          python quality/release_audit.py archive "work/mastery-tutor-${{ steps.version.outputs.value }}-codex.zip" --kind codex --git-ref HEAD --expected-version "${{ steps.version.outputs.value }}"
      - name: Upload platform candidates
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}
          path: |
            work/mastery-tutor-${{ steps.version.outputs.value }}-core.zip
            work/mastery-tutor-${{ steps.version.outputs.value }}-core.zip.sha256
            work/mastery-tutor-${{ steps.version.outputs.value }}-codex.zip
            work/mastery-tutor-${{ steps.version.outputs.value }}-codex.zip.sha256
          if-no-files-found: error
          retention-days: 14

  python-compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      MASTERY_HOME: ${{ github.workspace }}/work/ci-mastery-home
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Verify generated adapters
        run: python quality/build_adapters.py --check
      - name: Compile Python sources
        run: python -m compileall -q skills adapters quality
      - name: Run complete test suite
        run: python -m unittest discover -s quality -p "test_*.py" -v

  release-reproducibility:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - id: version
        name: Read release version
        shell: bash
        run: echo "value=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: work/release-candidates
      - name: Compare Windows and Linux core bytes
        run: >-
          python quality/release_audit.py compare
          work/release-candidates/release-ubuntu-latest/mastery-tutor-${{ steps.version.outputs.value }}-core.zip
          work/release-candidates/release-windows-latest/mastery-tutor-${{ steps.version.outputs.value }}-core.zip
      - name: Compare Windows and Linux Codex bytes
        run: >-
          python quality/release_audit.py compare
          work/release-candidates/release-ubuntu-latest/mastery-tutor-${{ steps.version.outputs.value }}-codex.zip
          work/release-candidates/release-windows-latest/mastery-tutor-${{ steps.version.outputs.value }}-codex.zip
      - name: Compare macOS and Linux candidate bytes
        shell: bash
        run: |
          python quality/release_audit.py compare "work/release-candidates/release-ubuntu-latest/mastery-tutor-${{ steps.version.outputs.value }}-core.zip" "work/release-candidates/release-macos-latest/mastery-tutor-${{ steps.version.outputs.value }}-core.zip"
          python quality/release_audit.py compare "work/release-candidates/release-ubuntu-latest/mastery-tutor-${{ steps.version.outputs.value }}-codex.zip" "work/release-candidates/release-macos-latest/mastery-tutor-${{ steps.version.outputs.value }}-codex.zip"
      - name: Compare checksum files
        shell: bash
        run: |
          python quality/release_audit.py compare "work/release-candidates/release-ubuntu-latest/mastery-tutor-${{ steps.version.outputs.value }}-core.zip.sha256" "work/release-candidates/release-windows-latest/mastery-tutor-${{ steps.version.outputs.value }}-core.zip.sha256"
          python quality/release_audit.py compare "work/release-candidates/release-ubuntu-latest/mastery-tutor-${{ steps.version.outputs.value }}-codex.zip.sha256" "work/release-candidates/release-windows-latest/mastery-tutor-${{ steps.version.outputs.value }}-codex.zip.sha256"
          python quality/release_audit.py compare "work/release-candidates/release-ubuntu-latest/mastery-tutor-${{ steps.version.outputs.value }}-core.zip.sha256" "work/release-candidates/release-macos-latest/mastery-tutor-${{ steps.version.outputs.value }}-core.zip.sha256"
          python quality/release_audit.py compare "work/release-candidates/release-ubuntu-latest/mastery-tutor-${{ steps.version.outputs.value }}-codex.zip.sha256" "work/release-candidates/release-macos-latest/mastery-tutor-${{ steps.version.outputs.value }}-codex.zip.sha256"
